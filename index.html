<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心理咨询前置情绪采集助手</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; background: #0D1B2A; }
.hero { padding: 56px 32px 40px; text-align: center; }
.badge { display: inline-block; background: #1B2D42; color: #7EB8D4; font-size: 12px; padding: 4px 14px; border-radius: 20px; border: 0.5px solid #2A4158; margin-bottom: 20px; }
.hero h1 { font-size: 28px; font-weight: 500; color: #E8F0F7; line-height: 1.35; margin-bottom: 12px; }
.hero p { font-size: 15px; color: #7A9BB5; line-height: 1.7; max-width: 480px; margin: 0 auto 32px; }
.features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 0 32px 40px; max-width: 720px; margin: 0 auto; }
.feature-card { background: #1B2D42; border: 0.5px solid #2A4158; border-radius: 12px; padding: 20px 16px; }
.feature-card h3 { font-size: 13px; font-weight: 500; color: #E8F0F7; margin-bottom: 6px; }
.feature-card p { font-size: 12px; color: #5A7A94; line-height: 1.6; }
.divider { height: 0.5px; background: #1B2D42; margin: 0 32px; }
.chat-section { padding: 32px; max-width: 720px; margin: 0 auto; }
.chat-label { font-size: 12px; color: #5A7A94; margin-bottom: 14px; }
.chat-wrapper { position: relative; border-radius: 14px; overflow: hidden; border: 0.5px solid #2A4158; height: 560px; }
.chat-cover { position: absolute; top: 0; left: 0; right: 0; height: 52px; background: #1B2D42; z-index: 10; border-bottom: 0.5px solid #2A4158; display: flex; align-items: center; padding: 0 16px; }
.chat-cover span { font-size: 13px; color: #7EB8D4; }
iframe { width: 100%; height: 100%; border: none; display: block; }
.footer { text-align: center; padding: 24px 32px; }
.footer p { font-size: 12px; color: #3A5A74; }
@media (max-width: 560px) {
  .features { grid-template-columns: 1fr; }
  .hero { padding: 40px 20px 28px; }
  .features { padding: 0 20px 28px; }
  .chat-section { padding: 20px; }
}
</style>
</head>
<body>
<div class="hero">
  <div class="badge">AI 心理咨询辅助工具</div>
  <h1>在咨询开始前，<br>先好好说说你的感受</h1>
  <p>通过自然对话，温和采集你的情绪状态与近期困扰，生成结构化洞察摘要，帮助咨询师更快理解你。</p>
</div>
<div class="features">
  <div class="feature-card">
    <h3>前置情绪采集</h3>
    <p>用对话代替问卷，低压力自然表达，捕捉碎片化但关键的心理信息</p>
  </div>
  <div class="feature-card">
    <h3>结构化情绪分析</h3>
    <p>自动识别情绪类型、强度与触发事件，将非结构化表达转化为可读数据</p>
  </div>
  <div class="feature-card">
    <h3>咨询前洞察摘要</h3>
    <p>生成专业摘要供咨询师参考，提升咨询效率，帮助问题更快聚焦</p>
  </div>
</div>
<div class="divider"></div>
<div class="chat-section">
  <p class="chat-label">你好，和我说说最近的状态吧</p>
  <div class="chat-wrapper">
    <div class="chat-cover"><span>心理咨询前置情绪采集助手</span></div>
    <iframe src="https://code.coze.cn/web-sdk/7643658950528843811" title="心理咨询前置情绪采集助手"></iframe>
  </div>
</div>
<div class="footer">
  <p>本工具不提供心理诊断或医疗建议，仅用于咨询前信息辅助采集</p>
</div>
</body>
</html>
