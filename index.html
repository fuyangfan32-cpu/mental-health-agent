<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心理咨询前置情绪采集助手</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; background: #FAF8F4; }
.hero { padding: 56px 32px 40px; text-align: center; }
.badge { display: inline-block; background: #F0EAD6; color: #7A5C2E; font-size: 12px; padding: 4px 14px; border-radius: 20px; border: 0.5px solid #D6C9A8; margin-bottom: 20px; }
.hero h1 { font-size: 28px; font-weight: 500; color: #3D2E1A; line-height: 1.35; margin-bottom: 12px; }
.hero p { font-size: 15px; color: #7A6A55; line-height: 1.7; max-width: 480px; margin: 0 auto 32px; }
.features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 0 32px 40px; max-width: 720px; margin: 0 auto; }
.feature-card { background: #FFFFFF; border: 0.5px solid #E8DFC8; border-radius: 12px; padding: 20px 16px; }
.feature-card h3 { font-size: 13px; font-weight: 500; color: #3D2E1A; margin-bottom: 6px; }
.feature-card p { font-size: 12px; color: #9A8A73; line-height: 1.6; }
.divider { height: 0.5px; background: #E8DFC8; margin: 0 32px; }
.chat-section { padding: 32px; max-width: 720px; margin: 0 auto; }
.chat-label { font-size: 12px; color: #9A8A73; margin-bottom: 14px; }
.chat-box { background: #FFFFFF; border: 0.5px solid #E0D4B8; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; height: 520px; }
.messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; }
.msg.user { background: #F0EAD6; color: #3D2E1A; align-self: flex-end; border-radius: 12px 12px 2px 12px; }
.msg.agent { background: #F7F5F0; color: #3D2E1A; align-self: flex-start; border-radius: 12px 12px 12px 2px; }
.msg.loading { color: #B5A58A; font-style: italic; }
.input-area { border-top: 0.5px solid #E8DFC8; padding: 12px 16px; display: flex; gap: 10px; align-items: flex-end; }
.input-area textarea { flex: 1; border: 0.5px solid #E0D4B8; border-radius: 8px; padding: 10px 12px; font-size: 14px; font-family: inherit; resize: none; outline: none; background: #FAF8F4; color: #3D2E1A; line-height: 1.5; max-height: 100px; }
.input-area textarea:focus { border-color: #C4A96A; }
.send-btn { background: #9B7A3A; color: white; border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; cursor: pointer; white-space: nowrap; }
.send-btn:hover { background: #7A5C2E; }
.send-btn:disabled { background: #D6C9A8; cursor: not-allowed; }
.footer { text-align: center; padding: 24px 32px; }
.footer p { font-size: 12px; color: #B5A58A; }
@media (max-width: 560px) {
  .features { grid-template-columns: 1fr; }
  .hero { padding: 40px 20px 28px; }
  .features { padding: 0 20px 28px; }
  .chat-section { padding: 20px; }
}
</style>
</head>
<body>
<div class="hero">
  <div class="badge">AI 心理咨询辅助工具</div>
  <h1>在咨询开始前，<br>先好好说说你的感受</h1>
  <p>通过自然对话，温和采集你的情绪状态与近期困扰，生成结构化洞察摘要，帮助咨询师更快理解你。</p>
</div>
<div class="features">
  <div class="feature-card">
    <h3>前置情绪采集</h3>
    <p>用对话代替问卷，低压力自然表达，捕捉碎片化但关键的心理信息</p>
  </div>
  <div class="feature-card">
    <h3>结构化情绪分析</h3>
    <p>自动识别情绪类型、强度与触发事件，将非结构化表达转化为可读数据</p>
  </div>
  <div class="feature-card">
    <h3>咨询前洞察摘要</h3>
    <p>生成专业摘要供咨询师参考，提升咨询效率，帮助问题更快聚焦</p>
  </div>
</div>
<div class="divider"></div>
<div class="chat-section">
  <p class="chat-label">你好，和我说说最近的状态吧</p>
  <div class="chat-box">
    <div class="messages" id="messages">
      <div class="msg agent">你好，我是你的咨询前情绪助手。在正式开始咨询之前，想先和你聊聊最近的状态。有什么想说的吗？</div>
    </div>
    <div class="input-area">
      <textarea id="input" placeholder="说说你的感受..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
    </div>
  </div>
</div>
<div class="footer">
  <p>本工具不提供心理诊断或医疗建议，仅用于咨询前信息辅助采集</p>
</div>
<script>
const TOKEN = "eyJhbGciOiJSUzI1NiIsImtpZCI6ImQyMmMwZmNiLTA5MWEtNDBmOS04NTc1LWUzNTE2YTJmZDA1NCJ9.eyJpc3MiOiJodHRwczovL2FwaS5jb3plLmNuIiwiYXVkIjpbIjRYbERqN3A2Z2k1TGlNYWhGVW5KS04wU2x1UWpxT2M4Il0sImV4cCI6ODIxMDI2Njg3Njc5OSwiaWF0IjoxNzc5NjgzNTE1LCJzdWIiOiJzcGlmZmU6Ly9hcGkuY296ZS5jbi93b3JrbG9hZF9pZGVudGl0eS9pZDo3NjQzNjY2NjY3NTU3MzU1NTcyIiwic3JjIjoiaW5ib3VuZF9hdXRoX2FjY2Vzc190b2tlbl9pZDo3NjQzNjgyNDk2NTI5MzAxNTIzIn0.roBQVaY443fiYfv3-YTPk16WuFj3VasRUtiDDoGQt5yqgym6a5CwCQ6JP-aIuB8e0Q0JWhmMx1gbQryNC6aGwIK_raIIVINcQ_pT04pz71PPpUgWn5hEdAEPKlqoYVKpQeeqXQlmBx6au2pARuRXtlg-xc8nX8W4qcuTBHfJMfD26ynD0Pz3paJcONtB7c83Jq8enGA5sBI080nwYLATIla9DUI0KO6FW-4UgTjqXUMqCbaLXsjbz_FXmBiglpwKSFG8XYpnIqWIRU9amT1gDZMj7yYeCV1yoj5onGc92yJiZahGWoqWthUVY9os96RckUX4xIfKjy4cInGklGm6dA";
const API = "https://f5qq9s47sc.coze.site/stream_run";
let history = [];
let sessionId = "session_" + Date.now();

const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");

inputEl.addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

function addMsg(text, role) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = "";
  sendBtn.disabled = true;
  addMsg(text, "user");
  history.push({ role: "user", content: text });
  const loading = addMsg("正在思考...", "agent loading");
  try {
    const res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + TOKEN },
      body: JSON.stringify({ text: text, session_id: sessionId })
    });
    const data = await res.json();
    const reply = data?.output || data?.message || data?.content || "收到你的消息了，能再多说一点吗？";
    loading.className = "msg agent";
    loading.textContent = reply;
    history.push({ role: "assistant", content: reply });
  } catch(e) {
    loading.className = "msg agent";
    loading.textContent = "网络出了点问题，请再试一次。";
  }
  sendBtn.disabled = false;
  inputEl.focus();
}
</script>
</body>
</html>
